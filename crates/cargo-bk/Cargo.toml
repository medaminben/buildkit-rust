[package]
name = "cargo-bk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generate and maintain products that use buildkit-rust"
build = "build.rs"

[lib]
name = "cargo_bk"
path = "src/lib.rs"

[[bin]]
name = "cargo-bk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
buildkit = { path = "../buildkit" }
clap = { version = "4", features = ["derive"] }
globset = "0.4.21"
include_dir = "0.7.4"
sha2 = "0.10"
toml_edit = "0.22"
walkdir = "2.5.0"

[build-dependencies]
buildkit = { path = "../buildkit" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
