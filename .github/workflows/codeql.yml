# Reusable CodeQL workflow for buildkit-rust products (Rust, no build needed).
#
# Caller example (the generated .github/workflows/codeql.yml looks like this):
#   on:
#     push:
#       branches: [main, Beta]
#     pull_request:
#     schedule:
#       - cron: "17 4 * * 1"
#   jobs:
#     codeql:
#       uses: medaminben/buildkit-rust/.github/workflows/codeql.yml@v0.1.0
#       permissions:
#         security-events: write
#         actions: read
#         contents: read
#
# The workflow takes no inputs: CodeQL analyses Rust source without a build
# (build-mode none). It lives apart from ci.yml so that only this job needs
# security-events: write. Private repositories need code scanning enabled.
name: CodeQL (reusable)

on:
  workflow_call:

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
