name: Bug report
description: Something in Foo does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Foo
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 'Foo version (Help or `--version`), operating system.'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output or the failing workflow run.
      render: text
